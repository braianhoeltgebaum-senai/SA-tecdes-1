<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Dashboard MES</title>

<script src="https://unpkg.com/htmx.org@1.9.12"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body {
    font-family: Arial;
    background: #111827;
    color: white;
    padding: 20px;
}

.cards {
    display: flex;
    gap: 20px;
}

.card {
    background: #1f2937;
    padding: 20px;
    border-radius: 10px;
    flex: 1;
    text-align: center;
}

.container {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    margin-top: 20px;
}

.box {
    background: #1f2937;
    padding: 20px;
    border-radius: 10px;
}
</style>
</head>

<body>

<h1>🏭 Dashboard MES</h1>

<div class="cards">
    <div class="card">
        <h3>Pendentes</h3>
        <h2 id="pendentes">0</h2>
    </div>

    <div class="card">
        <h3>Produção</h3>
        <h2 id="producao">0</h2>
    </div>

    <div class="card">
        <h3>Concluídos</h3>
        <h2 id="concluidos">0</h2>
    </div>
</div>

<div class="container">

    <div class="box">
        <h3>📊 Gráfico</h3>
        <canvas id="grafico"></canvas>
    </div>

    <div class="box">
        <h3>📋 Últimos pedidos</h3>

        <div 
            hx-get="/api/pedidos/tabela"
            hx-trigger="load, every 3s"
            hx-swap="innerHTML">
        </div>

    </div>

</div>

<script>

const API = "http://localhost:8088";

let chart;

async function load() {

    const res = await fetch(API + "/api/pedidos/dashboard");
    const data = await res.json();

    document.getElementById("pendentes").innerText = data.pendentes;
    document.getElementById("producao").innerText = data.emProducao;
    document.getElementById("concluidos").innerText = data.concluidos;

    if (!chart) {
        chart = new Chart(document.getElementById("grafico"), {
            type: 'doughnut',
            data: {
                labels: ['Pendentes', 'Produção', 'Concluídos'],
                datasets: [{
                    data: [data.pendentes, data.emProducao, data.concluidos]
                }]
            }
        });
    } else {
        chart.data.datasets[0].data = [
            data.pendentes,
            data.emProducao,
            data.concluidos
        ];
        chart.update();
    }
}

setInterval(load, 3000);
load();

</script>

</body>
</html>
