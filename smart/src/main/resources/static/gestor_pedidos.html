<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Smart Factory</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    #padrao-esquerda-0,
    #padrao-esquerda-1,
    #padrao-esquerda-2 {
      z-index: 11;
    }

    #padrao-frente-0,
    #padrao-frente-1,
    #padrao-frente-2 {
      z-index: 21;
    }

    #padrao-direita-0,
    #padrao-direita-1,
    #padrao-direita-2 {
      z-index: 16;
    }

    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      background: #0a0f1a;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      color: white;
    }

    /* ==========================================================================
         NAV PADRÃO SMART 4.0 — mesma regra em todas as páginas do sistema
         ========================================================================== */
    nav {
      width: 100%;
      background: #111c30;
      border-bottom: 1px solid #1e293b;
      padding: 15px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .nav-logo {
      display: flex;
      flex-direction: column;
    }

    .nav-logo h1 {
      font-size: 1.2rem;
      color: #38bdf8;
      font-weight: 700;
    }

    .nav-logo span {
      font-size: 0.75rem;
      color: #64748b;
    }

    .nav-menu {
      display: flex;
      gap: 20px;
      list-style: none;
    }

    .nav-menu a {
      color: #94a3b8;
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 500;
      transition: color 0.2s;
    }

    .nav-menu a:hover,
    .nav-menu a.active {
      color: #38bdf8;
    }

    /* ========================================================================== */

    /* Conteúdo da página — padding fica aqui, não no body, para o nav ocupar
         sempre a largura total em todas as páginas */
    .page-content {
      padding: 40px;
    }

    .layout {
      display: flex;
      gap: 30px;
      align-items: flex-start;
    }

    .painel-form {
      flex: 1;
      background: rgba(15, 23, 42, 0.92);
      border: 1px solid rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(10px);
      border-radius: 24px;
      padding: 30px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4),
        inset 0 0 0 1px rgba(255, 255, 255, 0.03);
    }

    /* Grid de 4 colunas no topo */
    .top-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr 1fr;
      gap: 18px;
      margin-bottom: 25px;
    }

    /* Grid de 2 colunas para a linha de expedição + IP (ou qualquer linha secundária) */
    .mid-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
      margin-bottom: 25px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .field label {
      font-size: 13px;
      font-weight: 600;
      color: #94a3b8;
    }

    input,
    select {
      background: #0f172a;
      border: 1px solid #334155;
      color: white;
      border-radius: 14px;
      padding: 14px;
      font-size: 15px;
      transition: 0.2s;
      width: 100%;
    }

    .tampa-global {
      width: 340px;
      height: 200px;
      position: relative;
    }

    #previewTampa {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
      z-index: 9999;
    }

    input:focus,
    select:focus {
      outline: none;
      border-color: #38bdf8;
      box-shadow: 0 0 0 4px rgba(56, 189, 248, 0.15);
    }

    .bloco {
      margin-top: 28px;
      border-radius: 22px;
      overflow: hidden;
      background: linear-gradient(180deg,
          rgba(30, 41, 59, 0.95),
          rgba(15, 23, 42, 0.95));
      border: 1px solid rgba(255, 255, 255, 0.06);
    }

    .bloco-header {
      padding: 18px 22px;
      background: rgba(255, 255, 255, 0.04);
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .bloco-header h2 {
      font-size: 18px;
      font-weight: 700;
    }

    .bloco-content {
      padding: 22px;
    }

    .laminasContainer {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .lamina-card {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 18px;
      padding: 18px;
    }

    .lamina-topo {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    .lamina-topo span {
      font-size: 14px;
      font-weight: 700;
      color: #e2e8f0;
    }

    .lamina-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 15px;
    }

    .btn {
      border: none;
      border-radius: 14px;
      padding: 13px 18px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s;
    }

    .btn-add {
      width: 100%;
      margin-top: 18px;
      background: linear-gradient(135deg, #06b6d4, #3b82f6);
      color: white;
    }

    .btn-add:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(59, 130, 246, 0.35);
    }

    .btn-remove {
      background: rgba(239, 68, 68, 0.18);
      color: #fca5a5;
      padding: 8px 14px;
    }

    .btn-remove:hover {
      background: rgba(239, 68, 68, 0.3);
    }

    .btn-salvar {
      width: 100%;
      margin-top: 30px;
      padding: 18px;
      font-size: 16px;
      background: linear-gradient(135deg, #0ea5e9, #2563eb);
      color: white;
    }

    .btn-salvar:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 28px rgba(37, 99, 235, 0.4);
    }

    .btn-salvar:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .painel-preview {
      width: 500px;
      position: sticky;
      top: 40px;
    }

    .preview-card {
      background: rgba(15, 23, 42, 0.92);
      border: 1px solid rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(10px);
      border-radius: 24px;
      padding: 25px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4),
        inset 0 0 0 1px rgba(255, 255, 255, 0.03);
    }

    .preview-title {
      text-align: center;
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 25px;
    }

    .stack {
      display: flex;
      flex-direction: column;
      gap: 10px;
      align-items: center;
    }

    /* ==========================================================================
   SISTEMA DE PREVIEW ISOMÉTRICO
   ========================================================================== */
    .bloco-preview {
      position: relative;
      width: 340px;
      height: 170px;
      isolation: isolate;
    }

    .camada {
      position: absolute;
      inset: 0;
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
      pointer-events: none;
    }

    .camada-base-fundo {
      z-index: 5;
    }

    .camada[data-posicao="1"],
    .camada[data-posicao="3"] {
      z-index: 10;
    }

    .camada[data-posicao="2"] {
      z-index: 20;
    }

    .camada-base-frontal {
      z-index: 30;
    }

    .tampa-global {
      width: 340px;
      height: 200px;
      margin-bottom: -15px;
      z-index: 999;
      position: relative;
    }

    /* Status de envio */
    .status-envio {
      margin-top: 12px;
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      display: none;
    }

    .status-envio.sucesso {
      background: rgba(34, 197, 94, 0.15);
      border: 1px solid rgba(34, 197, 94, 0.3);
      color: #86efac;
    }

    .status-envio.erro {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #fca5a5;
    }

    .status-envio.carregando {
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid rgba(56, 189, 248, 0.25);
      color: #7dd3fc;
    }

    /* ==========================================================================
   RESPONSIVIDADE
   ========================================================================== */
    @media (max-width: 1200px) {
      .layout {
        flex-direction: column;
      }

      .painel-preview {
        width: 100%;
        position: relative;
        top: 0;
      }

      .top-grid {
        grid-template-columns: 1fr 1fr;
      }

      .mid-grid {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 700px) {
      .page-content {
        padding: 20px;
      }

      .top-grid,
      .mid-grid,
      .lamina-grid {
        grid-template-columns: 1fr;
      }

      .bloco-preview,
      .tampa-global {
        width: 100%;
      }
    }
  </style>
</head>

<body>
  <nav>
    <div class="nav-logo">
      <h1>SMART 4.0 · Planta Digital</h1>
      <span>SENAI · Timbó-SC</span>
    </div>
    <ul class="nav-menu">
      <li><a href="gestor_pedidos.html" class="active">Gestor de Pedidos</a></li>
      <li><a href="gestor.html">Gestor de Produção</a></li>
      <li><a href="Dashboard_simples.html">Dashboard</a></li>
      <li><a href="visualizacaoBancada.html">Acompanhamento</a></li>
    </ul>
  </nav>

  <div class="page-content">
    <div class="layout">
      <!-- PAINEL ESQUERDO: FORMULÁRIO -->
      <div class="painel-form">
        <form id="formPedido">
          <!-- LINHA 1: Ordem, Tipo, Cor Tampa -->
          <!-- IP do CLP foi movido para o Gestor de Pedidos -->
          <div class="top-grid">
            <div class="field">
              <label>Ordem de Produção</label>
              <input type="text" id="ordemProducao" placeholder="0001" />
            </div>

            <div class="field">
              <label>Tipo do Pedido</label>
              <select id="tipoPedido">
                <option value="1">1 Bloco</option>
                <option value="2">2 Blocos</option>
                <option value="3">3 Blocos</option>
              </select>
            </div>

            <div class="field">
              <label>Cor da Tampa</label>
              <select id="corTampa" onchange="atualizarPreview()">
                <option value="0">Selecione a cor</option>
                <option value="1">Preto</option>
                <option value="2">Vermelho</option>
                <option value="3">Azul</option>
              </select>
            </div>
          </div>

          <!-- LINHA 2: Expedição -->
          <div class="mid-grid">
            <div class="field">
              <label>Posição da Expedição</label>
              <select id="posicaoExpedicao">
                <option value="">Selecione</option>
                <option value="1">Posição 1</option>
                <option value="2">Posição 2</option>
                <option value="3">Posição 3</option>
                <option value="4">Posição 4</option>
                <option value="5">Posição 5</option>
                <option value="6">Posição 6</option>
                <option value="7">Posição 7</option>
                <option value="8">Posição 8</option>
                <option value="9">Posição 9</option>
                <option value="10">Posição 10</option>
                <option value="11">Posição 11</option>
                <option value="12">Posição 12</option>
              </select>
            </div>
          </div>

          <!-- BLOCOS DINÂMICOS -->
          <div id="blocosContainer"></div>

          <!-- STATUS DE ENVIO -->
          <div class="status-envio" id="statusEnvio"></div>

          <!-- BOTÃO SALVAR -->
          <button class="btn btn-salvar" type="submit" id="btnSalvar">
            Salvar Pedido
          </button>
        </form>
      </div>

      <!-- PAINEL DIREITO: PREVIEW -->
      <div class="painel-preview">
        <div class="preview-card">
          <div class="preview-title">Visualização do Produto</div>
          <div class="stack">
            <div class="tampa-global">
              <div id="previewTampa" class="camada"></div>
            </div>

            <div id="previewStack"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // =========================================================================
    // INICIALIZAÇÃO
    // =========================================================================
    const tipoPedido = document.getElementById("tipoPedido");
    const blocosContainer = document.getElementById("blocosContainer");

    criarBlocos(1);

    tipoPedido.addEventListener("change", () => {
      criarBlocos(Number(tipoPedido.value));
    });

    // =========================================================================
    // BLOCOS
    // =========================================================================
    function criarBlocos(qtd) {
      if (qtd > 3) qtd = 3;

      blocosContainer.innerHTML = "";

      for (let i = 1; i <= qtd; i++) {
        blocosContainer.innerHTML += `
                <div class="bloco">
                    <div class="bloco-header">
                        <h2>Bloco ${i}</h2>
                    </div>
                    <div class="bloco-content">
                        <div class="field">
                            <label>Cor do Bloco</label>
                            <select class="corBloco" onchange="atualizarPreview()">
                                <option value="1">Preto</option>
                                <option value="2">Vermelho</option>
                                <option value="3">Azul</option>
                            </select>
                        </div>
                        <div class="laminasContainer"></div>
                        <button type="button" class="btn btn-add" onclick="adicionarLamina(this)">
                            + Adicionar Lâmina
                        </button>
                    </div>
                </div>
            `;
      }

      atualizarPreview();
    }

    // =========================================================================
    // LÂMINAS
    // =========================================================================
    function adicionarLamina(btn) {
      const bloco = btn.closest(".bloco");
      const container = bloco.querySelector(".laminasContainer");
      const total = container.querySelectorAll(".lamina-card").length;

      if (total >= 3) {
        alert("Máximo de 3 lâminas por bloco.");
        return;
      }

      const id = Date.now();

      container.insertAdjacentHTML(
        "beforeend",
        `
            <div class="lamina-card" id="lamina-${id}">
                <div class="lamina-topo">
                    <span>Lâmina ${total + 1}</span>
                    <button type="button" class="btn btn-remove" onclick="removerLamina('${id}')">
                        Remover
                    </button>
                </div>
                <div class="lamina-grid">

                    <div class="field">
                        <label>Cor</label>
                        <select class="corLamina" onchange="atualizarPreview()">
                            <option value="0">Nenhuma</option>
                            <option value="1">Vermelho</option>
                            <option value="2">Azul</option>
                            <option value="3">Amarelo</option>
                            <option value="4">Verde</option>
                            <option value="5">Preto</option>
                            <option value="6">Branco</option>
                        </select>
                    </div>

                    <div class="field">
                        <label>Padrão</label>
                        <select class="padraoLamina" onchange="atualizarPreview()">
                            <option value="0">Nenhum</option>
                            <option value="1">Casa</option>
                            <option value="2">Navio</option>
                            <option value="3">Estrela</option>
                        </select>
                    </div>

                    <div class="field">
                        <label>Posição</label>
                        <select class="posicaoLamina" onchange="atualizarPreview()">
                            <option value="0">Nenhuma</option>
                            <option value="1">Esquerda</option>
                            <option value="2">Frente</option>
                            <option value="3">Direita</option>
                        </select>
                    </div>

                </div>
            </div>
        `
      );

      atualizarPreview();
    }

    function removerLamina(id) {
      document.getElementById(`lamina-${id}`).remove();
      atualizarPreview();
    }

    // =========================================================================
    // CONTROLE DE POSIÇÕES DUPLICADAS
    // Impede que duas lâminas do MESMO bloco usem a mesma posição
    // (Esquerda / Frente / Direita), desabilitando no combobox as opções
    // já escolhidas por outra lâmina do bloco.
    // =========================================================================
    function atualizarOpcoesPosicao(bloco) {
      const selects = Array.from(bloco.querySelectorAll(".posicaoLamina"));
      const posicoesOcupadas = selects
        .map((s) => s.value)
        .filter((v) => v !== "0");

      selects.forEach((select) => {
        const valorAtual = select.value;
        Array.from(select.options).forEach((opt) => {
          if (opt.value === "0") {
            opt.disabled = false;
            return;
          }
          // Desabilita a opção se ela já está em uso por OUTRA lâmina do bloco
          opt.disabled =
            posicoesOcupadas.includes(opt.value) && opt.value !== valorAtual;
        });
      });
    }

    // =========================================================================
    // PREVIEW ISOMÉTRICO
    // =========================================================================
    function atualizarPreview() {
      const previewStack = document.getElementById("previewStack");
      previewStack.innerHTML = "";

      // Tampa
      const corTampa = document.getElementById("corTampa").value;
      document.getElementById(
        "previewTampa"
      ).style.backgroundImage = `url('assets/bloco/rTampa${corTampa}.png')`;

      document.querySelectorAll(".bloco").forEach((bloco, index) => {
        // Atualiza quais posições já estão ocupadas neste bloco antes de
        // desenhar o preview, para refletir imediatamente no combobox.
        atualizarOpcoesPosicao(bloco);

        const corBloco = bloco.querySelector(".corBloco").value;
        const blocoPreview = document.createElement("div");
        blocoPreview.className = "bloco-preview";

        blocoPreview.innerHTML = `
                <div class="camada" style="z-index:1; background-image:url('assets/bloco/rBlocoCor${corBloco}.png');"></div>
                <div class="camada" id="lamina-esquerda-${index}"></div>
                <div class="camada" id="lamina-frente-${index}"></div>
                <div class="camada" id="lamina-direita-${index}"></div>
                <div class="camada" id="padrao-esquerda-${index}"></div>
                <div class="camada" id="padrao-frente-${index}"></div>
                <div class="camada" id="padrao-direita-${index}"></div>
            `;

        previewStack.appendChild(blocoPreview);

        bloco.querySelectorAll(".lamina-card").forEach((card) => {
          const cor = card.querySelector(".corLamina").value;
          const padrao = card.querySelector(".padraoLamina").value;
          const posicao = card.querySelector(".posicaoLamina").value;

          if (posicao == 0) return;

          const nomePosicao =
            posicao == 1 ? "esquerda" : posicao == 2 ? "frente" : "direita";

          const zLamina = posicao == 1 ? 100 : posicao == 2 ? 200 : 150;
          const zPadrao = zLamina + 1;

          const camadaLamina = document.getElementById(
            `lamina-${nomePosicao}-${index}`
          );
          if (camadaLamina) {
            camadaLamina.style.zIndex = zLamina;
            camadaLamina.style.backgroundImage = `url('assets/laminas/lamina${posicao}-${cor}.png')`;
          }

          const camadaPadrao = document.getElementById(
            `padrao-${nomePosicao}-${index}`
          );
          if (camadaPadrao) {
            camadaPadrao.style.zIndex = zPadrao;

            if (padrao == 0) {
              camadaPadrao.style.backgroundImage = "none";
            } else {
              const caminho =
                posicao == 3
                  ? `assets/padroes/rPadrao${padrao}-2.png`
                  : `assets/padroes/padrao${padrao}-${posicao == 1 ? 1 : 2
                  }.png`;

              console.log(
                "Padrao:",
                padrao,
                "Posicao:",
                posicao,
                "Caminho:",
                caminho
              );
              camadaPadrao.style.backgroundImage = `url('${caminho}')`;
            }
          }
        });
      });
    }

    // =========================================================================
    // UTILITÁRIOS
    // =========================================================================

    // Valida os dados mínimos do pedido antes de enviar ao servidor,
    // evitando erros genéricos do backend para problemas óbvios do formulário.
    function validarPedido(pedido) {
      if (!pedido.ordemProducao) {
        return "Informe a Ordem de Produção.";
      }
      if (!pedido.corTampa || pedido.corTampa === 0) {
        return "Selecione a cor da tampa.";
      }
      if (pedido.posicaoExpedicao === null || pedido.posicaoExpedicao === undefined) {
        return "Selecione a posição da expedição.";
      }
      if (!pedido.blocos || pedido.blocos.length === 0) {
        return "O pedido precisa ter ao menos um bloco.";
      }
      const blocoSemCor = pedido.blocos.some((b) => !b.corBloco || b.corBloco === 0);
      if (blocoSemCor) {
        return "Todo bloco precisa ter uma cor definida.";
      }
      return null;
    }

    // Extrai uma mensagem de erro clara a partir da resposta HTTP.
    // Tenta ler JSON estruturado (message, erro, errors de validação) e,
    // se não encontrar nada útil, cai para um texto padrão por código HTTP.
    async function extrairMensagemErro(response) {
      let corpo = null;

      try {
        corpo = await response.clone().json();
      } catch (_) {
        try {
          corpo = await response.text();
        } catch (_) {
          corpo = null;
        }
      }

      let detalheBackend = null;

      if (corpo && typeof corpo === "object") {
        detalheBackend =
          corpo.message || corpo.mensagem || corpo.erro || corpo.detail || corpo.title || null;

        // Padrão de erro de validação do ASP.NET: { errors: { campo: ["msg", ...] } }
        if (!detalheBackend && corpo.errors) {
          const partes = [];
          for (const campo in corpo.errors) {
            const valores = corpo.errors[campo];
            const msgs = Array.isArray(valores) ? valores : [valores];
            msgs.forEach((m) => partes.push(`${campo}: ${m}`));
          }
          if (partes.length) detalheBackend = partes.join(" · ");
        }
      } else if (typeof corpo === "string" && corpo.trim()) {
        detalheBackend = corpo.trim();
      }

      const mensagensPorStatus = {
        400: "Dados do pedido inválidos. Verifique os campos preenchidos.",
        401: "Sessão expirada ou não autorizada. Faça login novamente.",
        403: "Você não tem permissão para criar pedidos.",
        404: "Endpoint de pedidos não encontrado no servidor. Verifique a configuração da API.",
        409: "Conflito ao salvar o pedido (ex: ordem de produção já existente).",
        422: "Não foi possível processar os dados enviados. Verifique os campos.",
        500: "Erro interno no servidor ao salvar o pedido. Tente novamente ou contate o suporte.",
        503: "Servidor indisponível no momento. Tente novamente em instantes."
      };

      const mensagemPadrao =
        mensagensPorStatus[response.status] ||
        `O servidor retornou um erro (HTTP ${response.status} - ${response.statusText || "desconhecido"}).`;

      return detalheBackend ? `${mensagemPadrao} Detalhe: ${detalheBackend}` : mensagemPadrao;
    }

    function mostrarStatus(mensagem, tipo) {
      const el = document.getElementById("statusEnvio");
      el.textContent = mensagem;
      el.className = `status-envio ${tipo}`;
      el.style.display = "block";

      if (tipo !== "carregando") {
        setTimeout(() => {
          el.style.display = "none";
        }, 5000);
      }
    }

    // =========================================================================
    // SUBMIT: APENAS SALVAR PEDIDO
    // O envio ao CLP acontece no Gestor de Pedidos, via botão "Enviar para Produção"
    // =========================================================================
    document
      .getElementById("formPedido")
      .addEventListener("submit", async (e) => {
        e.preventDefault();

        const btnSalvar = document.getElementById("btnSalvar");
        btnSalvar.disabled = true;
        btnSalvar.textContent = "Salvando...";
        mostrarStatus("Salvando pedido...", "carregando");

        // --- Monta os blocos ---
        const blocos = [];

        document.querySelectorAll(".bloco").forEach((bloco) => {
          const laminas = [];

          bloco.querySelectorAll(".lamina-card").forEach((card) => {
            laminas.push({
              cor: Number(card.querySelector(".corLamina").value),
              padrao: Number(card.querySelector(".padraoLamina").value),
              posicaoNoBloco: Number(
                card.querySelector(".posicaoLamina").value
              ),
            });
          });

          blocos.push({
            corBloco: Number(bloco.querySelector(".corBloco").value),
            laminas: laminas,
          });
        });

        // --- Lê posicaoExpedicao ---
        const posicaoExpedicaoEl = document.getElementById("posicaoExpedicao");
        const posicaoExpedicao = posicaoExpedicaoEl.value
          ? Number(posicaoExpedicaoEl.value)
          : null;

        // --- Monta payload do pedido ---
        const pedido = {
          ordemProducao: document.getElementById("ordemProducao").value.trim(),
          tipoPedido: Number(tipoPedido.value),
          corTampa: Number(document.getElementById("corTampa").value),
          posicaoExpedicao: posicaoExpedicao,
          dataPedido: new Date().toISOString(), // timestamp para o banco
          blocos: blocos,
        };

        // --- Validação no front antes de chamar a API ---
        const erroValidacao = validarPedido(pedido);
        if (erroValidacao) {
          mostrarStatus("✘ " + erroValidacao, "erro");
          btnSalvar.disabled = false;
          btnSalvar.textContent = "Salvar Pedido";
          return;
        }

        try {
          // Salva o pedido no banco — sem enviar ao CLP
          const response = await fetch("http://localhost:8088/pedidos", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(pedido),
          });

          if (!response.ok) {
            const mensagemErro = await extrairMensagemErro(response);
            throw new Error(mensagemErro);
          }

          const data = await response.json();
          console.log("Pedido salvo:", data);

          // A API pode retornar o id como "id" ou "idPedido" dependendo do backend
          const idSalvo = data.id ?? data.idPedido ?? "—";

          mostrarStatus(
            `✔ Pedido #${idSalvo} salvo com sucesso! Acesse o Gestor de Pedidos para enviar à produção.`,
            "sucesso"
          );

        } catch (error) {
          console.error(error);

          // Erro de rede (servidor fora do ar, CORS, sem conexão) não tem response
          const mensagemFinal =
            error instanceof TypeError
              ? "Não foi possível conectar ao servidor. Verifique se o backend está em execução (http://localhost:8088) e sua conexão."
              : error.message;

          mostrarStatus("✘ " + mensagemFinal, "erro");
        } finally {
          btnSalvar.disabled = false;
          btnSalvar.textContent = "Salvar Pedido";
        }
      });
  </script>
</body>

</html>
