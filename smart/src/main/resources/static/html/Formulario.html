


<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Factory</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f1f5f9;
            padding: 30px;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #1e293b;
        }

        .layout {
            display: flex;
            gap: 30px;
            align-items: flex-start;
        }

        .formulario {
            flex: 1;
            background: white;
            padding: 25px;
            border-radius: 10px;
        }

        .preview {
            width: 450px;
            background: #1e293b;
            border-radius: 10px;
            padding: 20px;
            color: white;
            position: sticky;
            top: 20px;
        }

        .campo {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
            font-weight: bold;
        }

        input,
        select {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #cbd5e1;
        }

        .bloco-card {
            margin-top: 25px;
            border: 1px solid #dbeafe;
            padding: 15px;
            border-radius: 10px;
            background: #f8fafc;
        }

        .bloco-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 15px;
            color: #1d4ed8;
        }

        .lamina-card {
            border: 1px solid #dbeafe;
            border-radius: 8px;
            padding: 10px;
            margin-top: 15px;
            background: white;
        }

        .btn {
            padding: 10px 15px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-add {
            background: #2563eb;
            color: white;
            margin-top: 10px;
        }

        .btn-remove {
            background: #ef4444;
            color: white;
            margin-top: 10px;
        }

        .btn-salvar {
            background: #111827;
            color: white;
            width: 100%;
            margin-top: 25px;
        }

        .palco {
            position: relative;
            width: 350px;
            height: 600px;
            margin: auto;
        }

        .camada {
            position: absolute;
            width: 100%;
            height: 100%;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            pointer-events: none;
        }

        .bloco-preview {
            position: absolute;
            width: 100%;
            height: 180px;
        }

        #bloco1 {
            top: 0px;
        }

        #bloco2 {
            top: 140px;
        }

        #bloco3 {
            top: 280px;
        }

        .tampa {
            z-index: 999;
            top: -20px !important;
        }

        pre {
            background: #0f172a;
            color: #e2e8f0;
            padding: 15px;
            margin-top: 20px;
            border-radius: 8px;
            overflow: auto;
        }
    </style>
</head>

<body>

    <h1>Smart Factory</h1>

    <div class="layout">

        <div class="formulario">

            <form id="formPedido">

                <div class="campo">
                    <label>Ordem Produção</label>
                    <input type="text" id="ordemProducao">
                </div>

                <div class="campo">
                    <label>Tipo Pedido</label>

                    <select id="tipoPedido">
                        <option value="1">1 Bloco</option>
                        <option value="2">2 Blocos</option>
                        <option value="3">3 Blocos</option>
                    </select>
                </div>

                <div class="campo">
                    <label>Cor Tampa</label>

                    <select id="corTampa">
                        <option value="1">Preto</option>
                        <option value="2">Vermelho</option>
                        <option value="3">Azul</option>
                    </select>
                </div>

                <div id="blocosContainer"></div>

                <button class="btn btn-salvar" type="submit">
                    Salvar Pedido
                </button>

            </form>

            <pre id="resultado"></pre>

        </div>

        <div class="preview">

            <h2 style="margin-bottom:20px;">Prévia</h2>

            <div class="palco" id="palcoPreview"></div>

        </div>

    </div>

    <script>

        const tipoPedido = document.getElementById("tipoPedido");
        const blocosContainer = document.getElementById("blocosContainer");
        const palcoPreview = document.getElementById("palcoPreview");

        criarBlocos(1);

        tipoPedido.addEventListener("change", () => {
            criarBlocos(Number(tipoPedido.value));
        });

        document.getElementById("corTampa")
            .addEventListener("change", atualizarPreview);

        function criarBlocos(qtd) {

            blocosContainer.innerHTML = "";

            for (let i = 1; i <= qtd; i++) {

                blocosContainer.innerHTML += `

                <div class="bloco-card">

                    <div class="bloco-title">
                        Bloco ${i}
                    </div>

                    <div class="campo">
                        <label>Cor Bloco</label>

                        <select class="corBloco"
                            onchange="atualizarPreview()">

                            <option value="1">Preto</option>
                            <option value="2">Vermelho</option>
                            <option value="3">Azul</option>

                        </select>
                    </div>

                    <div class="campo">
                        <label>ID Estoque</label>

                        <input type="number"
                            class="estoqueId"
                            value="${i}">
                    </div>

                    <div class="laminasContainer"></div>

                    <button
                        type="button"
                        class="btn btn-add"
                        onclick="adicionarLamina(this)">

                        + Lâmina

                    </button>

                </div>
                `;

                const bloco =
                    blocosContainer.querySelectorAll(".bloco-card")[i - 1];

                adicionarLamina(
                    bloco.querySelector(".btn-add")
                );
            }

            atualizarPreview();
        }

        function adicionarLamina(btn) {

            const bloco =
                btn.closest(".bloco-card");

            const container =
                bloco.querySelector(".laminasContainer");

            const total =
                container.querySelectorAll(".lamina-card").length;

            if (total >= 3) {
                alert("Máximo 3 lâminas");
                return;
            }

            const div = document.createElement("div");

            div.className = "lamina-card";

            div.innerHTML = `

            <div class="campo">

                <label>Cor Lâmina</label>

                <select class="corLamina"
                    onchange="atualizarPreview()">

                    <option value="1">Vermelho</option>
                    <option value="2">Azul</option>
                    <option value="3">Amarelo</option>
                    <option value="4">Verde</option>
                    <option value="5">Preto</option>
                    <option value="6">Branco</option>

                </select>

            </div>

            <div class="campo">

                <label>Padrão</label>

                <select class="padraoLamina"
                    onchange="atualizarPreview()">

                    <option value="1">Casa</option>
                    <option value="2">Navio</option>
                    <option value="3">Estrela</option>

                </select>

            </div>

            <div class="campo">

                <label>Posição</label>

                <select class="posicaoLamina"
                    onchange="atualizarPreview()">

                    <option value="1">Esquerda</option>
                    <option value="2">Frente</option>
                    <option value="3">Direita</option>

                </select>

            </div>

            <button
                type="button"
                class="btn btn-remove"
                onclick="removerLamina(this)">

                Remover

            </button>
            `;

            container.appendChild(div);

            atualizarPreview();
        }

        function removerLamina(btn) {

            btn.closest(".lamina-card").remove();

            atualizarPreview();
        }

        function atualizarPreview() {

            palcoPreview.innerHTML = "";

            const qtdBlocos =
                Number(tipoPedido.value);

            const corTampa =
                document.getElementById("corTampa").value;

            const blocos =
                document.querySelectorAll(".bloco-card");

            blocos.forEach((bloco, index) => {

                const numeroBloco = index + 1;

                const blocoContainer =
                    document.createElement("div");

                blocoContainer.className =
                    "bloco-preview";

                blocoContainer.id =
                    `bloco${numeroBloco}`;

                // BLOCO BASE

                const corBloco =
                    bloco.querySelector(".corBloco").value;

                blocoContainer.innerHTML += `
                <div class="camada"
                    style="
                        z-index:1;
                        background-image:url('../assets/bloco/rBlocoCor${corBloco}.png');
                    ">
                </div>
                `;

                // LÂMINAS

                bloco.querySelectorAll(".lamina-card")
                    .forEach(lamina => {

                        const cor =
                            lamina.querySelector(".corLamina").value;

                        const padrao =
                            lamina.querySelector(".padraoLamina").value;

                        const posicao =
                            lamina.querySelector(".posicaoLamina").value;

                        // LÂMINA

                        blocoContainer.innerHTML += `
                        <div class="camada"
                            style="
                                z-index:${10 + Number(posicao)};
                                background-image:url('../assets/laminas/lamina${posicao}-${cor}.png');
                            ">
                        </div>
                        `;

                        // PADRÃO

                        blocoContainer.innerHTML += `
                        <div class="camada"
                            style="
                                z-index:${20 + Number(posicao)};
                                background-image:url('../assets/padroes/padrao${posicao}-${padrao}.png');
                            ">
                        </div>
                        `;
                    });

                // TAMPA APENAS NO PRIMEIRO BLOCO

                if (index === 0) {

                    blocoContainer.innerHTML += `
                    <div class="camada tampa"
                        style="
                            background-image:url('../assets/bloco/rTampa${corTampa}.png');
                        ">
                    </div>
                    `;
                }

                palcoPreview.appendChild(blocoContainer);

            });

        }

        atualizarPreview();

        // ENVIO BACKEND

        document.getElementById("formPedido")
            .addEventListener("submit", async (e) => {

                e.preventDefault();

                const blocos = [];

                document.querySelectorAll(".bloco-card")
                    .forEach(bloco => {

                        const laminas = [];

                        bloco.querySelectorAll(".lamina-card")
                            .forEach(l => {

                                laminas.push({

                                    cor: Number(
                                        l.querySelector(".corLamina").value
                                    ),

                                    padrao: Number(
                                        l.querySelector(".padraoLamina").value
                                    ),

                                    posicaoNoBloco: Number(
                                        l.querySelector(".posicaoLamina").value
                                    )

                                });

                            });

                        blocos.push({

                            corBloco: Number(
                                bloco.querySelector(".corBloco").value
                            ),

                            estoque: {
                                id: Number(
                                    bloco.querySelector(".estoqueId").value
                                )
                            },

                            laminas: laminas

                        });

                    });

                const pedido = {

                    ordemProducao:
                        document.getElementById("ordemProducao").value,

                    tipoPedido:
                        Number(tipoPedido.value),

                    corTampa:
                        Number(
                            document.getElementById("corTampa").value
                        ),

                    statusPedido: 1,

                    posicaoExpedicao: 1,

                    blocos: blocos
                };

                document.getElementById("resultado")
                    .textContent =
                    JSON.stringify(pedido, null, 2);

                try {

                    const response =
                        await fetch(
                            "http://localhost:8088/pedidos",
                            {
                                method: "POST",

                                headers: {
                                    "Content-Type": "application/json"
                                },

                                body: JSON.stringify(pedido)
                            }
                        );

                    if (response.ok) {

                        alert("Pedido salvo!");

                    } else {

                        alert("Erro backend");

                    }

                } catch {

                    alert("Erro conexão backend");

                }

            });

    </script>

</body>

</html>
